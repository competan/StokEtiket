plugins {
    id 'com.android.application'
}

android {
    namespace 'com.erp.etiket'
    compileSdk 34

    defaultConfig {
        applicationId 'com.erp.etiket'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // SQL Server bağlantısı (Vega veritabanına doğrudan)
    implementation 'net.sourceforge.jtds:jtds:1.3.1'
    // Barkod çizimi
    implementation 'com.google.zxing:core:3.5.3'
}
